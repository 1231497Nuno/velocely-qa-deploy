# CI — corre em push/PR para DEV, QA e PROD
name: CI

on:
  push:
    branches: [DEV, QA, PROD]
  pull_request:
    branches: [DEV, QA, PROD]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Syntax / import check
        run: python -c "import server; print('ok', server.app.title)"
      # Testes de integração precisam de API+Atlas; aqui só validamos o pacote.
      - name: Compile
        run: python -m compileall app server.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Build
        env:
          REACT_APP_BACKEND_URL: https://example.invalid
          CI: "true"
        run: npm run build
