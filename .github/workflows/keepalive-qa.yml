# Mantém a API QA (Render free) acordada — evita cold start de ~1 min.
name: Keepalive QA

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake velocely-qa-api
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 \
              "https://velocely-qa-api.onrender.com/api/branding" || echo 000)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          exit 1
